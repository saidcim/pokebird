<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 730" width="1120" height="730" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    .bg    { fill: #ffffff; }
    .card  { fill: #f7f8fa; stroke: #c9cfd8; stroke-width: 1.5; rx: 8; }
    .mcu   { fill: #eef3fb; stroke: #5b7fb9; stroke-width: 2; rx: 10; }
    .unused{ fill: #f4f4f4; stroke: #cfcfcf; stroke-width: 1.5; stroke-dasharray: 5 4; rx: 8; }
    .free  { fill: #fbf7ea; stroke: #cbb673; stroke-width: 1.5; rx: 8; }
    .band  { fill: #f2f5f9; stroke: #c9cfd8; stroke-width: 1.5; rx: 8; }
    .title { font-size: 21px; font-weight: 700; fill: #1d2430; }
    .sub   { font-size: 12.5px; fill: #5c6675; }
    .h     { font-size: 14px; font-weight: 700; fill: #1d2430; }
    .t     { font-size: 12px; fill: #333c49; }
    .m     { font-size: 11.5px; fill: #333c49; font-family: 'DejaVu Sans Mono',Consolas,monospace; }
    .dim   { font-size: 11.5px; fill: #8a94a2; }
    .lbl   { font-size: 11px; fill: #5c6675; font-family: 'DejaVu Sans Mono',Consolas,monospace; }
    .wire  { stroke: #5b7fb9; stroke-width: 2; fill: none; }
    .wire2 { stroke: #7d9a55; stroke-width: 2; fill: none; }
    .wire3 { stroke: #b08040; stroke-width: 2; fill: none; }
    .wireg { stroke: #b7bec8; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
  </style>

  <rect class="bg" x="0" y="0" width="1120" height="730"/>

  <text class="title" x="28" y="34">PokeBird — wiring / pin map</text>
  <text class="sub"   x="28" y="54">Waveshare RP2350-Touch-LCD-3.49. Every peripheral below is already on that module; nothing is wired by hand.</text>
  <text class="sub"   x="28" y="72">Pin assignments were read off the Waveshare schematic and are the source of firmware/src/board_config.h.</text>

  <!-- MCU -->
  <rect class="mcu" x="430" y="200" width="255" height="215"/>
  <text class="h"   x="557" y="232" text-anchor="middle">RP2350B</text>
  <text class="t"   x="557" y="253" text-anchor="middle">2 × Cortex-M33 @ 150 MHz</text>
  <text class="t"   x="557" y="271" text-anchor="middle">520 KB SRAM · 16 MB flash</text>
  <text class="dim" x="557" y="289" text-anchor="middle">no PSRAM</text>
  <line x1="452" y1="303" x2="663" y2="303" stroke="#c3cfe3" stroke-width="1.5"/>
  <text class="t"   x="557" y="325" text-anchor="middle">core 1: audio + inference</text>
  <text class="t"   x="557" y="343" text-anchor="middle">core 0: UI + storage</text>
  <text class="dim" x="557" y="367" text-anchor="middle">FIFO between them carries</text>
  <text class="dim" x="557" y="383" text-anchor="middle">detection events only</text>

  <!-- ES8311 + mic + speaker -->
  <rect class="card" x="40" y="120" width="300" height="140"/>
  <text class="h" x="58" y="145">ES8311 audio codec</text>
  <text class="t" x="58" y="166">MEMS microphone MIC1 → MIC1P/MIC1N</text>
  <text class="t" x="58" y="184">NS4150B class-D amp → speaker (MX1.25 H1)</text>
  <text class="m" x="58" y="209">GPIO 1  I2S_DSDIN   MCU → codec (DAC)</text>
  <text class="m" x="58" y="226">GPIO 2  I2S_DSOUT   codec → MCU (mic)</text>
  <text class="m" x="58" y="243">GPIO 3/4/5  MCLK / SCLK(BCLK) / LRCK(WS)</text>
  <path class="wire" d="M340 190 H 390 V 250 H 430"/>
  <text class="lbl" x="348" y="183">PIO + DMA, 24 kHz 16-bit mono</text>

  <!-- shared I2C -->
  <rect class="card" x="40" y="285" width="300" height="96"/>
  <text class="h" x="58" y="310">Shared I2C bus — GPIO 6 SDA / 7 SCL</text>
  <text class="t" x="58" y="331">ES8311 codec — control registers</text>
  <text class="t" x="58" y="349">QMI8658 IMU — present, deliberately unused</text>
  <text class="t" x="58" y="367">PCF85063 RTC — present, unused (no battery backup)</text>
  <path class="wire" d="M340 320 H 430"/>

  <!-- amplifier control -->
  <rect class="card" x="40" y="406" width="300" height="62"/>
  <text class="h" x="58" y="431">Amplifier control</text>
  <text class="m" x="58" y="453">GPIO 0  NS_MODE — NS4150B mode / enable</text>
  <path class="wire" d="M340 437 H 390 V 400 H 430"/>

  <!-- power -->
  <rect class="card" x="40" y="494" width="300" height="96"/>
  <text class="h" x="58" y="519">Power</text>
  <text class="m" x="58" y="541">GPIO 38/39  SYS_OUT / SYS_EN — power latch</text>
  <text class="m" x="58" y="558">GPIO 40     BAT_ADC — battery voltage</text>
  <text class="t" x="58" y="578">The board's own button wakes and sleeps the device.</text>
  <path class="wire3" d="M340 540 H 405 V 408 H 430"/>

  <!-- display -->
  <rect class="card" x="775" y="120" width="305" height="160"/>
  <text class="h" x="793" y="145">AXS15231B display — 172 × 640</text>
  <text class="t" x="793" y="166">QSPI, partial render, no full framebuffer</text>
  <text class="m" x="793" y="191">GPIO 20     LCD_SCL</text>
  <text class="m" x="793" y="208">GPIO 21-24  LCD_D0..D3</text>
  <text class="m" x="793" y="225">GPIO 25     LCD_CS</text>
  <text class="m" x="793" y="242">GPIO 34/35  LCD_RST / LCD_TE (tearing)</text>
  <text class="m" x="793" y="259">GPIO 36/37  LCD_BL / BL_EN (backlight)</text>
  <path class="wire2" d="M685 250 H 730 V 200 H 775"/>
  <text class="lbl" x="697" y="243">DMA</text>

  <!-- touch -->
  <rect class="card" x="775" y="300" width="305" height="80"/>
  <text class="h" x="793" y="325">Touch panel — separate I2C</text>
  <text class="m" x="793" y="347">GPIO 32/33  TP_SDA / TP_SCL</text>
  <text class="m" x="793" y="364">GPIO 11     TP_INT — interrupt</text>
  <path class="wire2" d="M685 320 H 775"/>

  <!-- SD -->
  <rect class="unused" x="775" y="400" width="305" height="80"/>
  <text class="h" x="793" y="425">microSD — wired, not used by the firmware</text>
  <text class="m" x="793" y="447">GPIO 26-31  SCLK, MOSI, MISO, D1, D2, CS</text>
  <text class="t" x="793" y="466">4-bit SDIO is also possible on these pins.</text>
  <path class="wireg" d="M685 375 H 730 V 440 H 775"/>

  <!-- free headers -->
  <rect class="free" x="775" y="500" width="305" height="90"/>
  <text class="h" x="793" y="525">Free pins, brought out to headers</text>
  <text class="m" x="793" y="547">GPIO 12-19  header P3   (8 pins)</text>
  <text class="m" x="793" y="564">GPIO 41-47  header J3/J6 (7 pins)</text>
  <text class="t" x="793" y="583">Reserved for an external I2S microphone if needed.</text>
  <path class="wireg" d="M685 395 H 745 V 545 H 775"/>

  <!-- signal-flow band -->
  <rect class="band" x="40" y="618" width="1040" height="86"/>
  <text class="h" x="58" y="643">Signal path on core 1</text>
  <text class="t" x="58" y="665">I2S/PIO+DMA → ring buffer → mel features (64 × 187 int8) → stage 0 energy gate → stage 1 bird / not-bird → stage 2 species (179 classes) → 8-window vote</text>
  <text class="dim" x="58" y="686">Mel frames are computed incrementally, so three seconds of raw audio is never held in RAM. Dashed blocks above are populated on the module but not driven by this firmware; yellow is unallocated I/O.</text>
  <path class="wire" d="M557 415 V 618"/>
</svg>
